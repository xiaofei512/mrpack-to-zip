<!doctype html>
<html lang="en">

        margin: 0 0 12px;
        font-size: clamp(2rem, 8vw, 3.5rem);

      }

        margin: 0 0 20px;
        color: #3e424d;
      }

        display: inline-flex;
        min-height: 44px;
        align-items: center;
        border: 1px solid #17181f;
        border-radius: 7px;
        background: #17181f;
        color: #fffdf7;
        font-weight: 800;
        padding: 0 16px;
